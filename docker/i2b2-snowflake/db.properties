# i2b2 Snowflake connection template (KEY-PAIR / SERVICE-USER auth).
#
# create_snowflake_image.sh generates the real per-cell db.properties from
# these fields, substituting per cell:
#   SF_ACCOUNT       -> Snowflake account identifier (e.g. abc12345.us-east-2.aws)
#   DB_NAME          -> Snowflake database          (e.g. I2B2_DEV)
#   SCHEMA_NAME      -> per-cell schema             (I2B2METADATA, I2B2DATA, ...)
#   WAREHOUSE        -> Snowflake warehouse         (e.g. I2B2_ETL_WH)
#   ROLE_NAME        -> Snowflake role              (e.g. I2B2)
#   USER_NAME        -> service user                (e.g. I2B2)
#   PRIVATE_KEY_FILE -> path to the PKCS#8 private key (rsa_key.p8)
#
# Authentication is key-pair (authenticator=SNOWFLAKE_JWT) -- there is no
# password. If the private key is encrypted, the orchestrator appends
# &private_key_file_pwd=... from I2B2_PRIVATE_KEY_PWD. All six cells use the
# same service user/role and differ only by schema.
db.type=snowflake
db.username=USER_NAME
db.password=
db.driver=net.snowflake.client.jdbc.SnowflakeDriver
db.url=jdbc:snowflake://SF_ACCOUNT.snowflakecomputing.com/?db=DB_NAME&schema=SCHEMA_NAME&warehouse=WAREHOUSE&role=ROLE_NAME&authenticator=SNOWFLAKE_JWT&private_key_file=PRIVATE_KEY_FILE&CLIENT_RESULT_COLUMN_CASE_INSENSITIVE=true&JDBC_QUERY_RESULT_FORMAT=JSON
db.project=act
